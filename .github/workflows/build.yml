name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Fix plugin SDK versions
        run: |
          sed -i 's/sdk: \^3\.12\.2/sdk: ">=3.4.0 <4.0.0"/g' app/pubspec.yaml
          sed -i 's/sdk: \^3\.10\.0/sdk: ">=3.4.0 <4.0.0"/g' app/plugins/tor_hidden_service/pubspec.yaml
          sed -i 's/sdk: >=3\.4\.0 <4\.0\.0/sdk: ">=3.4.0 <4.0.0"/g' app/plugins/tor_hidden_service/pubspec.yaml
          echo "--- Fixed main pubspec ---"
          cat app/pubspec.yaml | grep -A2 environment
          echo "--- Fixed plugin pubspec ---"
          cat app/plugins/tor_hidden_service/pubspec.yaml | grep -A2 environment
      - name: Get dependencies
        working-directory: app
        run: flutter pub get
      - name: Build APK
        working-directory: app
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OnionChat-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk