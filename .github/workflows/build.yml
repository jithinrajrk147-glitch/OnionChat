name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Fix SDK versions
        run: |
          sed -i 's/sdk: \^3\.12\.2/sdk: ">=3.4.0 <4.0.0"/g' app/pubspec.yaml
          sed -i 's/sdk: \^3\.10\.0/sdk: ">=3.4.0 <4.0.0"/g' app/plugins/tor_hidden_service/pubspec.yaml
          sed -i 's/sdk: >=3\.4\.0 <4\.0\.0/sdk: ">=3.4.0 <4.0.0"/g' app/plugins/tor_hidden_service/pubspec.yaml
          sed -i 's/sdk: >=3\.4\.0 <4\.0\.0/sdk: ">=3.4.0 <4.0.0"/g' app/pubspec.yaml
      - name: Get dependencies
        working-directory: app
        run: flutter pub get
      - name: Build APK
        working-directory: app
        run: flutter build apk --release --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OnionChat-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk