name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Fix plugin SDK versions
        run: |
          find app -name "pubspec.yaml" -exec sed -i 's/\^3\.10\.0/>=3.4.0 <4.0.0/g' {} \;
          find app -name "pubspec.yaml" -exec sed -i 's/\^3\.12\.2/>=3.4.0 <4.0.0/g' {} \;
          cat app/plugins/tor_hidden_service/pubspec.yaml
      - name: Get dependencies
        working-directory: app
        run: flutter pub get
      - name: Build APK
        working-directory: app
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OnionChat-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk